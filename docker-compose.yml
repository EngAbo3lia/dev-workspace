services:
  workspace-init:
    image: alpine:3.22
    command:
      - sh
      - -c
      - "mkdir -p /workspace && chown 1000:1000 /workspace && chmod 0775 /workspace"
    volumes:
      - dev_workspace:/workspace
    restart: "no"

  warp-terminal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WARP_REF: ${WARP_REF:-ae60375ef1d3895908756878fe4a07cbe703ce1a}
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-4}
    image: warp-terminal:${WARP_REF:-ae60375ef1d3895908756878fe4a07cbe703ce1a}
    restart: unless-stopped
    init: true
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    environment:
      TTYD_USER: ${TTYD_USER:-warp}
      TTYD_PASSWORD: ${TTYD_PASSWORD}
      TTYD_MAX_CLIENTS: ${TTYD_MAX_CLIENTS:-4}
      TZ: ${TZ:-Africa/Cairo}
    volumes:
      - dev_workspace:/workspace
      - warp_home:/home/warp
    expose:
      - 7681
    mem_limit: 4g
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${TTYD_USER}:$${TTYD_PASSWORD}\" http://127.0.0.1:7681/ -o /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  code-server:
    image: codercom/code-server:${CODE_SERVER_VERSION:-4.141.0}
    restart: unless-stopped
    init: true
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD}
      TZ: ${TZ:-Africa/Cairo}
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - --disable-telemetry
      - --disable-update-check
      - /workspace
    volumes:
      - dev_workspace:/workspace
      - code_data:/home/coder
    expose:
      - 8080
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then((r) => { process.exit(r.ok ? 0 : 1); }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  dev_workspace:
  warp_home:
  code_data:
