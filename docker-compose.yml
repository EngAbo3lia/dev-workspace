services:
  workspace-init:
    image: alpine:3.22
    command:
      - sh
      - -c
      - "mkdir -p /workspace && chown 1000:1000 /workspace && chmod 0775 /workspace"
    volumes:
      - /srv/dev-workspace:/workspace
    restart: "no"

  code-server:
    image: codercom/code-server:${CODE_SERVER_VERSION:-4.141.0}
    restart: unless-stopped
    init: true
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD}
      TZ: ${TZ:-Africa/Cairo}
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - --disable-telemetry
      - --disable-update-check
      - /workspace
    volumes:
      - /srv/dev-workspace:/workspace
      - code_data:/home/coder
    ports:
      - "8100:8080"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.devws-code-48-web.entrypoints=web
      - traefik.http.routers.devws-code-48-web.rule=Host(`code.aboalia.com`)
      - traefik.http.services.devws-code-48-web.loadbalancer.server.port=8080
      - traefik.http.routers.devws-code-test.entrypoints=web
      - traefik.http.routers.devws-code-test.rule=Host(`code-test.aboalia.com`)
      - traefik.http.services.devws-code-test.loadbalancer.server.port=8080
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then((r) => { process.exit(r.ok ? 0 : 1); }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  code_data:

networks:
  dokploy-network:
    external: true
